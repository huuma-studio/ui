name: Publish pre-release to JSR
# Publishes jsr.json's version from `next` on every push (every merged PR)
# when it's a pre-release (e.g. 0.3.0-beta.1). JSR skips a version that's
# already published, so only a version bump publishes. JSR doesn't mark
# pre-releases as latest, so apps only get one when they ask for it.
# Releases publish from `main` (publish.yml).
on:
  push:
    branches:
      - next

# One publish at a time, if two PRs are merged in quick succession.
concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # A regular version (e.g. 0.2.11) publishes from `main` only.
      - name: Check the version is a pre-release
        id: version
        run: |
          version=$(jq -r .version jsr.json)
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "Publishing @huuma/ui@$version, unless it's already on JSR" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "::notice::$version isn't a pre-release; nothing to publish from next." ;;
          esac

      # Installs the dependencies: JSR publish resolves npm packages
      # through node_modules.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.version.outputs.prerelease == 'true'
        with:
          node-version: "24"

      - name: Publish package
        if: steps.version.outputs.prerelease == 'true'
        run: vp exec jsr publish
