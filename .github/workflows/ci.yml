name: ci
run-name: change request by ${{ github.actor }}
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the floating v1 tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test
      - run: vp run jsr:dry-run
  deno-smoke:
    # Deno is best effort (spec #126, D4): this job never blocks a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-all --node-modules-dir=none test/deno/
