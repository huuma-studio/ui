name: ci
run-name: change request by ${{ github.actor }}
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the floating v1 tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test
      # Again with upstream Vite instead of Vite+'s copy: apps don't need
      # Vite+ (spec #126).
      - run: vp test
        env:
          HUUMA_VITE: upstream
      - run: vp run jsr:dry-run
      # The native npm build (not published), which also enforces
      # isolatedDeclarations: `vp check` doesn't report those errors.
      - run: vp run pack
  deno-smoke:
    # Deno is best effort (spec #126, D4): this job never blocks a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # No minimum dependency age (24 hours by default): the tests take the
      # newest versions jsr.json allows, which can be one of our own releases
      # from today, like @huuma/route 0.3.1.
      - run: deno test --allow-all --no-check --node-modules-dir=none --minimum-dependency-age=0 test/deno/
