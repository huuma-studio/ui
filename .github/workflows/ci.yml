name: ci
run-name: change request by ${{ github.actor }}
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: the floating v1 tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp check
      # For the browser tests, which fail in CI without a Chromium: the
      # runner image's Chrome, so CI needs no download and no apt mirror.
      - run: echo "HUUMA_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: vp test
      # Again with upstream Vite instead of Vite+'s copy: apps don't need
      # Vite+ (spec #126).
      - run: vp test
        env:
          HUUMA_VITE: upstream
      # For the dry run: the package is published with `deno publish`.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: vp run jsr:dry-run
      # The native npm build (not published), which also enforces
      # isolatedDeclarations: `vp check` doesn't report those errors.
      - run: vp run pack
  deno-smoke:
    # Deno is best effort (spec #126, D4): this job never blocks a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs node_modules, which Vite on Deno uses (test/deno/vite.test.ts).
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno test --allow-all --no-check --node-modules-dir=none test/deno/
